name: Auditoria das oficinas completas
on:
  push:
    branches: [main, codex/oficinas-completas]
    paths:
      - 'casos/*completa.json'
      - 'js/**'
      - 'tests/e2e/**'
      - '.github/workflows/oficinas.yml'
  workflow_dispatch:
jobs:
  oficinas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Autoria, arquivos e impressão
        run: node --test tests/e2e/autoria.e2e.mjs
      - name: Conduzir as duas oficinas completas até o resultado
        env:
          MOSAICO_CASOS: cancao-exilio-completa,citologia-completa
        run: node --test tests/e2e/aula.e2e.mjs
