<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MOSAICO · Participar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0f17">
<link rel="stylesheet" href="css/mosaico.css">
</head>
<body>
<header class="topo">
  <div class="barra">
    <span class="marca"><img class="logo" src="assets/mosaico.webp" alt="" width="40" height="40">MOSAICO</span>
    <span class="status" id="identidade"></span>
  </div>
</header>
<main class="pagina">
  <section id="entrada" class="cartao entrada-sala">
    <a class="voltar-link" href="index.html" data-ico="voltar">Início</a>
    <div class="entrada-cab"><span data-ilu="e_participar" data-tam="72"></span><h1>Entrar na sala</h1></div>
    <div id="blocoCodigo">
      <label for="codigo">Código da sala</label>
      <input id="codigo" class="campo-codigo" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="6 números">
    </div>
    <p id="salaEscolhida" class="sala-escolhida" hidden>Sala <strong id="salaNumero"></strong> <button type="button" class="btn discreto pequeno" id="trocarSala" data-sem-ico>trocar</button></p>
    <label for="nome">Seu nome</label>
    <input id="nome" class="campo-nome" maxlength="30" autocomplete="given-name" placeholder="Como quer ser chamado" enterkeyhint="go">
    <div class="linha-botoes"><button class="btn primario bloco" id="entrar">Entrar na sala</button></div>
    <p class="aviso" id="avisoEntrada" hidden></p>
    <p class="sutil entrada-privacidade">Seu nome só é usado nesta atividade e é apagado quando a sala é encerrada.</p>
  </section>
  <section id="jogo" hidden>
    <p id="anuncio" class="visualmente-oculto" aria-live="polite"></p>
    <div id="status"></div>
    <div id="tarefa"></div>
  </section>
  <footer class="rodape-licenca">© 2026 Prof. Mário César Nascimento, PhD · Todos os direitos reservados · <a href="licenca.html">Licença de uso</a></footer>
</main>
<script type="module" src="js/participar.js"></script>
<script type="module" src="js/nav.js"></script>
</body>
</html>
