<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOSAICO · Telão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/mosaico.css">
</head>
<body class="telao">
<div class="telao-palco">
  <header>
    <span class="marca"><span class="ladrilhos"><i></i><i></i><i></i><i></i></span>MOSAICO</span>
    <span id="cabecalho" class="sutil"></span>
  </header>
  <section class="telao-centro" id="centro">
    <div class="cartao" style="max-width:640px;margin:auto">
      <h1>Abrir o telão</h1>
      <label for="codigo">Código da sala</label>
      <input id="codigo" inputmode="numeric" maxlength="6">
      <div class="linha-botoes"><button class="btn primario" id="abrir">Mostrar</button></div>
      <p class="aviso" id="avisoTelao" hidden></p>
    </div>
  </section>
  <footer><span id="rodape"></span><span>Prof. Mário César Nascimento, PhD ©</span></footer>
</div>
<script src="js/qr.js"></script>
<script type="module" src="js/telao.js"></script>
</body>
</html>
