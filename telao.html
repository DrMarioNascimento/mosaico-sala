<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mosaico Sala · Telão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0f17">
<link rel="stylesheet" href="css/mosaico.css">
</head>
<body class="telao">
<div class="telao-palco">
  <header>
    <span class="marca"><img class="logo" src="assets/mosaico.webp" alt="" width="40" height="40">Mosaico Sala</span>
    <span style="display:flex;gap:.8em;align-items:center"><span id="cabecalho" class="sutil"></span><button class="btn btn-tela-cheia" id="telaCheia" title="Tela cheia (tecla F)" aria-label="Tela cheia">⛶</button></span>
  </header>
  <section class="telao-centro" id="centro">
    <div class="cartao" style="max-width:640px;margin:auto">
      <nav class="fluxo" data-fluxo-docente aria-label="Navegação do professor"></nav>
      <h1>Abrir o telão</h1>
      <label for="codigo">Código da sala</label>
      <input id="codigo" inputmode="numeric" maxlength="6">
      <div class="linha-botoes"><button class="btn primario" id="abrir">Mostrar</button></div>
      <p class="aviso" id="avisoTelao" hidden></p>
    </div>
  </section>
  <footer><span id="rodape"></span><span>© 2026 Prof. Mário César Nascimento, PhD · <a href="licenca.html" style="color:inherit">Licença de uso</a></span></footer>
</div>
<script src="js/qr.js"></script>
<script type="module" src="js/telao.js"></script>
<script type="module" src="js/nav.js"></script>
</body>
</html>
