<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manual do MOSAICO · Sala</title>
<meta name="description" content="Manual completo do MOSAICO · Sala: para que serve, os passos do professor e do aluno, todas as atividades e por que funcionam.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="stylesheet" href="css/mosaico.css">
<style>
  /* Manual: mesmo tema escuro da plataforma; na impressão vira papel branco, uma seção por página. */
  .manual { max-width: 980px; margin: 0 auto; padding: 0 16px 60px; }
  .manual section { margin: 0 0 56px; scroll-margin-top: 80px; }
  .manual h2 { font-size: clamp(1.6rem, 3.6vw, 2.2rem); display: flex; align-items: center; gap: 14px; margin: 0 0 14px; }
  .manual h2 img, .manual h3 img { flex: none; }
  .manual h3 { font-size: 1.3rem; display: flex; align-items: center; gap: 10px; margin: 26px 0 8px; }
  .manual p, .manual li { font-size: 1.08rem; line-height: 1.6; }
  .manual .sutil { color: var(--texto-2); }
  .ico3d { width: 56px; height: 56px; object-fit: contain; }
  .ico3d.p { width: 34px; height: 34px; }
  .ico3d.g { width: 96px; height: 96px; }
  .num { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--acento); color: #1b1206; font: 900 1.2rem var(--fonte-titulo); flex: none; }

  /* capa */
  .capa { min-height: 92vh; display: grid; place-items: center; text-align: center; padding: 40px 0; }
  .capa .logo-capa { width: 168px; height: 168px; }
  .capa h1 { font-size: clamp(2.4rem, 7vw, 4.2rem); margin: 10px 0 6px; letter-spacing: .02em; }
  .capa .sub { font-size: clamp(1.1rem, 2.6vw, 1.45rem); color: var(--texto-2); max-width: 32em; margin: 0 auto 26px; }
  .capa .faixa { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 18px auto 26px; max-width: 760px; }
  .capa .faixa img { width: 58px; height: 58px; object-fit: contain; }
  .capa .meta-capa { color: var(--texto-2); font-size: 1rem; }
  .botoes-capa { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 18px; }

  /* sumário */
  .sumario ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  @media (min-width: 720px) { .sumario ol { grid-template-columns: 1fr 1fr; } }
  .sumario a { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--linha); background: var(--cartao); color: var(--texto); text-decoration: none; font-weight: 700; }
  .sumario a:hover { border-color: var(--acento-2); }
  .sumario a .n { color: var(--acento); font: 900 1.1rem var(--fonte-titulo); min-width: 1.6em; }

  /* blocos */
  .grade2 { display: grid; gap: 14px; }
  @media (min-width: 720px) { .grade2 { grid-template-columns: 1fr 1fr; } }
  .grade4 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .bloco { border: 1px solid var(--linha); border-radius: 18px; background: linear-gradient(160deg, var(--cartao-2), var(--fundo-2)); padding: 18px; }
  .bloco h4 { font: 800 1.15rem var(--fonte-titulo); margin: 6px 0; }
  .bloco p { margin: 4px 0; font-size: 1rem; }
  .bloco.destaque { border: 2px solid var(--acento); }
  .pilar { text-align: center; }
  .pilar img { width: 72px; height: 72px; object-fit: contain; }

  /* passo com foto */
  .passo { display: grid; gap: 18px; align-items: start; margin: 18px 0 30px; }
  @media (min-width: 760px) { .passo { grid-template-columns: minmax(0, 1fr) 230px; } }
  .passo .cab { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .passo .cab h3 { margin: 0; }
  .tela { width: 230px; max-width: 100%; justify-self: center; border-radius: 26px; border: 3px solid #2c3a57; background: #000; padding: 6px; box-shadow: 0 10px 26px #0006; }
  .tela img { width: 100%; height: auto; display: block; border-radius: 20px; }
  .tela-larga { width: 100%; max-width: 640px; border-radius: 14px; border: 3px solid #2c3a57; display: block; margin: 12px auto; }
  .legenda { text-align: center; color: var(--texto-2); font-size: .9rem; margin-top: 6px; }
  .dica { border-left: 4px solid var(--acento-2); background: #3ddcff12; border-radius: 10px; padding: 10px 14px; margin: 10px 0; }
  .atencao { border-left: 4px solid var(--alerta); background: #ffd23d12; border-radius: 10px; padding: 10px 14px; margin: 10px 0; }
  .fluxo-linha { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0; }
  .fluxo-linha .et { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--linha); background: var(--cartao); font-weight: 700; }
  .fluxo-linha .et img { width: 28px; height: 28px; object-fit: contain; }
  .fluxo-linha .seta { color: var(--acento); font-weight: 900; }

  /* atividades */
  .atividade { border: 1px solid var(--linha); border-radius: 20px; background: linear-gradient(160deg, var(--cartao-2), var(--fundo-2)); padding: 20px; margin: 16px 0; break-inside: avoid; }
  .atividade .topo-at { display: flex; align-items: center; gap: 16px; }
  .atividade .topo-at h3 { margin: 0; }
  .atividade .tag { display: inline-block; font-size: .78rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--acento-2); }
  .atividade dl { display: grid; grid-template-columns: 1fr; gap: 6px 14px; margin: 12px 0 0; }
  @media (min-width: 720px) { .atividade dl { grid-template-columns: 170px 1fr; } }
  .atividade dt { font-weight: 800; color: var(--acento); }
  .atividade dd { margin: 0; line-height: 1.55; }
  .atividade .com-foto { display: grid; gap: 16px; }
  @media (min-width: 760px) { .atividade .com-foto { grid-template-columns: minmax(0, 1fr) 200px; } .atividade .tela { width: 200px; } }
  table.tab { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 1rem; }
  table.tab th, table.tab td { border-bottom: 1px solid var(--linha); padding: 8px 10px; text-align: left; vertical-align: top; }
  table.tab th { color: var(--acento-2); font-family: var(--fonte-titulo); }
  .faq details { border: 1px solid var(--linha); border-radius: 14px; padding: 12px 16px; margin: 8px 0; background: var(--cartao); }
  .faq summary { font-weight: 800; cursor: pointer; }
  .refs li { font-size: .98rem; }
  .barra-manual { position: sticky; top: 0; z-index: 5; background: #0b0f17ee; backdrop-filter: blur(6px); border-bottom: 1px solid var(--linha); }
  .barra-manual .dentro { max-width: 980px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  .barra-manual .marca { font-size: 1.1rem; }
  .barra-manual .btn { margin-left: auto; min-height: 44px; }

  @media print {
    @page { size: A4; margin: 14mm; }
    :root { --texto: #111; --texto-2: #444; --cartao: #fff; --cartao-2: #fff; --fundo-2: #fff; --linha: #ccc; }
    body { background: #fff !important; color: #111; font-size: 11pt; }
    .barra-manual, .botoes-capa, .nao-imprimir { display: none !important; }
    .manual section { break-before: page; margin: 0; }
    .capa { min-height: 250mm; }
    .sumario { break-before: page; }
    .bloco, .atividade, .passo { break-inside: avoid; box-shadow: none; background: #fff !important; }
    .tela { box-shadow: none; }
    a { color: #111; }
  }
  /* Área do professor: até confirmar o login, só o cartão de entrada aparece. */
  body.manual-fechado .manual, body.manual-fechado .barra-manual .btn { display: none !important; }
  .manual-acesso { max-width: 520px; margin: 12vh auto; padding: 28px; border-radius: 22px; border: 1px solid var(--linha); background: linear-gradient(160deg, var(--cartao-2), var(--fundo-2)); display: grid; gap: 12px; text-align: center; }
  .manual-acesso h1 { margin: 0; }
  .manual-acesso .btn { min-height: 56px; }
</style>
</head>
<body class="manual-fechado">
<header class="barra-manual">
  <div class="dentro">
    <a class="marca" href="planejar.html" title="Painel do professor" style="color:inherit;text-decoration:none"><img class="logo" src="assets/mosaico.webp" alt="" width="36" height="36">MOSAICO</a>
    <span class="sutil">Manual</span>
    <button class="btn" type="button" onclick="print()">Imprimir ou salvar em PDF</button>
  </div>
</header>

<section class="manual-acesso" id="acessoManual" hidden>
  <h1>Manual do professor</h1>
  <p>O manual fica na área do professor. Entre com a sua conta Google para ler.</p>
  <button class="btn primario" id="entrarManual" type="button">Entrar com Google</button>
  <p class="aviso" id="avisoManual" role="alert" hidden></p>
  <p><a href="index.html">Voltar ao início</a></p>
</section>

<main class="manual" id="conteudoManual" aria-live="polite"></main>
<script type="module" src="js/manual-acesso.js"></script>
</body>
</html>
